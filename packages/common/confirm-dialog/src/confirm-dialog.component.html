<h2 mat-dialog-title>
  {{ titleKey | translate }}
</h2>
<div mat-dialog-content>
  {{ confirmMessage | translate }}
</div>
<div mat-dialog-actions align="end">
  <button matButton (click)="dialogRef.close(false)">
    {{ cancelKey | translate }}
  </button>
  <button matButton="filled" (click)="dialogRef.close(true)">
    {{ proccessKey | translate }}
  </button>
</div>
